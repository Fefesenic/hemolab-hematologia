<script>
const objectiveQuestions = [
  { id:'obj1', theme:'Anemias', level:'Intermediário', title:'Anemia ferropriva: padrão laboratorial', stem:'Mulher de 34 anos apresenta fadiga, pica e menorragia. Hemograma: Hb 8,7 g/dL, VCM 68 fL, HCM 21 pg, RDW 19%. Ferritina 5 ng/mL, ferro sérico reduzido e CTLF aumentada. Qual interpretação é a mais adequada?', options:['Anemia de doença crônica, com ferro sequestrado','Anemia ferropriva por perda crônica de sangue','Talassemia menor sem deficiência de ferro','Anemia megaloblástica por deficiência de B12','Anemia hemolítica autoimune'], answer:1, explanation:'O padrão é clássico de deficiência de ferro: microcitose e hipocromia com RDW elevado, ferritina baixa, ferro baixo e capacidade total de ligação do ferro aumentada. Em uma mulher com menorragia, a perda ginecológica crônica é uma causa provável, mas deve-se investigar a fonte do sangramento.', tags:['VCM baixo','Ferritina baixa','RDW alto'] },
  { id:'obj2', theme:'Anemias', level:'Avançado', title:'Hemograma na anemia megaloblástica', stem:'Paciente de 62 anos tem parestesias, glossite e marcha instável. Hb 7,9 g/dL, VCM 118 fL, neutrófilos hipersegmentados e LDH muito elevada. Qual achado favorece deficiência de vitamina B12 em vez de deficiência de folato?', options:['Reticulocitopenia','Macrocitose importante','Neutrófilos hipersegmentados','Manifestações neurológicas','LDH elevada'], answer:3, explanation:'As manifestações neurológicas — parestesias, alteração de marcha e comprometimento proprioceptivo — são particularmente associadas à deficiência de vitamina B12. Folato e B12 podem causar anemia megaloblástica, mas a reposição isolada de folato em deficiência de B12 pode piorar a lesão neurológica.', tags:['VCM alto','Neuropatia','B12'] },
  { id:'obj3', theme:'Onco-hematologia', level:'Avançado', title:'Leucemia promielocítica aguda', stem:'Homem de 29 anos chega com equimoses difusas, sangramento gengival e febre. Plaquetas 18.000/mm³. O coagulograma evidencia TP e TTPa prolongados, fibrinogênio baixo e D-dímero elevado. O esfregaço mostra promielócitos anômalos com bastões de Auer. Qual conduta é prioritária?', options:['Aguardar imunofenotipagem para iniciar tratamento','Iniciar ácido transretinoico (ATRA) imediatamente','Administrar apenas heparina não fracionada','Iniciar ferro intravenoso','Realizar esplenectomia de urgência'], answer:1, explanation:'A combinação de promielócitos anômalos e coagulação intravascular disseminada sugere leucemia promielocítica aguda. O ATRA deve ser iniciado imediatamente diante da suspeita, antes mesmo da confirmação molecular, pois reduz rapidamente o risco de morte por coagulopatia. O suporte transfusional é essencial.', tags:['ATRA','CIVD','Bastões de Auer'] },
  { id:'obj4', theme:'Imuno-hematologia', level:'Intermediário', title:'Púrpura trombocitopênica imune', stem:'Mulher de 27 anos apresenta petéquias e epistaxe. Hb e leucócitos normais; plaquetas 12.000/mm³. TP e TTPa normais. Não há esplenomegalia. Qual diagnóstico é mais provável?', options:['Púrpura trombocitopênica imune (PTI)','Coagulação intravascular disseminada','Púrpura trombótica trombocitopênica','Hipersplenismo','Leucemia aguda'], answer:0, explanation:'A trombocitopenia isolada, com provas de coagulação normais e ausência de esplenomegalia, é compatível com PTI. Na PTI, a destruição imune periférica de plaquetas predomina. A avaliação deve excluir causas secundárias e medicamentos, e a gravidade do sangramento orienta o tratamento.', tags:['Plaquetas isoladas','TP normal','TTPa normal'] },
  { id:'obj5', theme:'Coagulopatias', level:'Intermediário', title:'Hemofilia A', stem:'Menino de 8 anos apresenta hemartroses recorrentes após pequenos traumas. O TP é normal e o TTPa está prolongado. O teste de mistura corrige o TTPa. Qual fator está mais provavelmente reduzido?', options:['Fator II','Fator V','Fator VIII','Fator VII','Fator XIII'], answer:2, explanation:'Hemofilia A é causada por deficiência do fator VIII, geralmente ligada ao X. O padrão clássico é TP normal, TTPa prolongado e correção no teste de mistura, indicando deficiência de fator em vez de inibidor. Hemartroses profundas são típicas.', tags:['Fator VIII','Herança ligada ao X','Hemartrose'] },
  { id:'obj6', theme:'Onco-hematologia', level:'Avançado', title:'Leucemia mieloide crônica', stem:'Paciente de 48 anos apresenta sudorese noturna, perda ponderal e esplenomegalia. Leucócitos 142.000/mm³ com desvio à esquerda e basofilia. A pesquisa demonstra translocação t(9;22). Qual alvo terapêutico é central?', options:['CD20','BCR-ABL1 tirosina-quinase','JAK2 exclusivamente','CD3','PML-RARA'], answer:1, explanation:'A t(9;22) forma o cromossomo Filadélfia e o gene de fusão BCR-ABL1, cuja tirosina-quinase constitutivamente ativa impulsiona a LMC. Inibidores de tirosina-quinase, como imatinibe, são a base do tratamento dirigido.', tags:['BCR-ABL1','Filadélfia','LMC'] }
];
const essayQuestions = [
  { id:'ess1', theme:'Anemias', level:'Avançado', title:'Caso integrado: anemia macrocítica', stem:'Uma paciente de 58 anos apresenta fadiga progressiva, parestesias nos pés e dificuldade para caminhar. Hemograma: Hb 8,2 g/dL, VCM 123 fL, leucócitos 2.900/mm³, plaquetas 105.000/mm³. Esfregaço: macro-ovalócitos e neutrófilos hipersegmentados. LDH e bilirrubina indireta estão elevadas. Solicita-se que você formule a hipótese diagnóstica, explique o mecanismo e indique exames confirmatórios e conduta inicial.', answer:'O quadro sugere anemia megaloblástica por deficiência de vitamina B12, possivelmente por anemia perniciosa. A síntese defeituosa de DNA causa eritropoiese ineficaz e pode comprometer as três linhagens, explicando a pancitopenia, a LDH elevada e a bilirrubina indireta por hemólise intramedular. Devem ser dosadas vitamina B12, folato, ácido metilmalônico e homocisteína; investigar anticorpos antifator intrínseco e anticélula parietal. A reposição de B12 deve ser iniciada, especialmente porque há sintomas neurológicos, sem aguardar toda a investigação.', criteria:['Reconhecer anemia megaloblástica','Relacionar pancitopenia e hemólise intramedular','Diferenciar B12 de folato pelos sintomas neurológicos','Citar B12, folato, ácido metilmalônico e homocisteína','Propor reposição de B12 e investigação etiológica'] },
  { id:'ess2', theme:'Coagulopatias', level:'Avançado', title:'Interpretação de coagulograma', stem:'Homem de 23 anos apresenta sangramento prolongado após extração dentária. Nega hemartroses. TP normal, TTPa discretamente prolongado, contagem de plaquetas normal. O teste de mistura corrige o TTPa. Discuta o diagnóstico diferencial, a interpretação do teste e a abordagem inicial.', answer:'O padrão indica alteração da via intrínseca por deficiência de fator ou, menos provavelmente, interferência pré-analítica. A correção no teste de mistura favorece deficiência de fator, enquanto a ausência de hemartroses e o sangramento mucoso tornam doença de von Willebrand uma hipótese importante, pois pode reduzir o fator VIII. Deve-se revisar medicamentos e coleta, dosar fator VIII, fator IX, atividade e antígeno do fator de von Willebrand e considerar testes de função plaquetária. A conduta depende do diagnóstico e do procedimento, podendo incluir concentrado de fator ou desmopressina em casos selecionados.', criteria:['Identificar via intrínseca alterada','Interpretar correção no teste de mistura','Considerar doença de von Willebrand','Diferenciar padrão mucoso de hemartrose','Indicar dosagens de fatores e vWF'] },
  { id:'ess3', theme:'Onco-hematologia', level:'Avançado', title:'Leucocitose e esfregaço', stem:'Paciente de 67 anos apresenta febre, astenia e equimoses. Hemograma: Hb 8,5 g/dL, plaquetas 34.000/mm³ e leucócitos 58.000/mm³. O esfregaço mostra 35% de blastos. Explique as prioridades diagnósticas e terapêuticas nas primeiras horas.', answer:'O caso deve ser tratado como suspeita de leucemia aguda com falência medular até prova em contrário. É prioritário avaliar instabilidade, infecção, sangramento e sinais de leucostase. Devem ser solicitados imunofenotipagem por citometria, cariótipo, FISH/PCR conforme suspeita, coagulograma, fibrinogênio, eletrólitos, ácido úrico, creatinina e LDH. Deve-se iniciar suporte transfusional individualizado, antibiótico empírico se neutropenia febril, prevenção/tratamento da síndrome de lise tumoral e, se houver suspeita de leucemia promielocítica, ATRA imediatamente.', criteria:['Reconhecer leucemia aguda','Priorizar suporte e estabilização','Solicitar imunofenotipagem e estudos genéticos','Avaliar CIVD e lise tumoral','Citar ATRA se houver suspeita de LPA'] }
];
const supplementalObjectiveQuestions = [
  { id:'sup1', theme:'Anemias', level:'Intermediário', title:'PA 1 • Anemia falciforme e eletroforese', stem:'Um homem de 30 anos apresenta eletroforese de hemoglobina com 80% de hemoglobina S. Em relação ao caso, assinale a alternativa correta.', options:['Pessoas com traço falciforme (Hb AS) podem ser levemente anêmicas.','Raramente são encontradas hemácias em foice em pacientes HBSS assintomáticos.','Pacientes HbSS têm crises hemolíticas principalmente por deficiência de ácido fólico.','Os primeiros sintomas dos pacientes com HbSS começam após os 6 meses de vida.','Infecções em HbSS são mais frequentemente causadas por bactérias atípicas.'], answer:3, explanation:'Na anemia falciforme, os primeiros sintomas costumam surgir após a queda da hemoglobina fetal, geralmente por volta dos 5–6 meses de vida. O traço falciforme em geral não causa anemia significativa; as crises hemolíticas da HbSS decorrem da falcização, e as infecções graves são especialmente associadas a bactérias encapsuladas.', tags:['HbSS','HbS','Hemoglobina fetal'] },
  { id:'sup2', theme:'Anemias', level:'Intermediário', title:'PA 1 • Manifestação incomum na doença falciforme', stem:'Em relação às manifestações clínicas da anemia falciforme, qual destas não é comum?', options:['Síndrome torácica aguda.','Acidente vascular cerebral isquêmico.','Colelitíase.','Dactilite.','Esplenomegalia gigante.'], answer:4, explanation:'A doença falciforme pode causar síndrome torácica aguda, AVC, colelitíase por hemólise crônica e dactilite. A autoesplenectomia progressiva é típica, portanto esplenomegalia gigante não é uma manifestação habitual em adultos com HbSS.', tags:['Dactilite','Autoesplenectomia','Síndrome torácica'] },
  { id:'sup3', theme:'Imuno-hematologia', level:'Avançado', title:'PA 1 • Anemia hemolítica autoimune no LES', stem:'Mulher jovem com lúpus apresenta anemia grave, palidez e icterícia. Hb 5,9 g/dL, VCM 104 fL e RDW normal. Qual é a melhor conduta inicial?', options:['Repor vitamina B12 e ácido fólico.','Solicitar teste da antiglobulina direta e provas de hemólise.','Realizar exame de medula óssea para afastar anemia aplásica.','Realizar eletroforese de hemoglobina.','Investigar anemia perniciosa com anticorpos anti-fator intrínseco.'], answer:1, explanation:'A associação de LES, anemia aguda, icterícia e macrocitose discreta sugere hemólise autoimune. A prioridade é confirmar hemólise com reticulócitos, LDH, bilirrubina indireta e haptoglobina, além do teste da antiglobulina direta (Coombs direto).', tags:['LES','Coombs direto','Hemólise'] },
  { id:'sup4', theme:'Anemias', level:'Intermediário', title:'PA 1 • Anemia megaloblástica e neutrófilos hipersegmentados', stem:'Homem de 55 anos apresenta Hb 6,3 g/dL, VCM 114 fL, reticulócitos baixos e neutrófilos hipersegmentados. Qual diagnóstico e conduta são mais adequados?', options:['Anemia da doença crônica; tratar apenas a doença de base.','Deficiência de folato; investigar B12 e folato e iniciar reposição apropriada.','Deficiência de G6PD; repor apenas ácido fólico.','Esferocitose hereditária; repor ferro parenteral.','Eliptocitose hereditária; realizar transfusão como tratamento definitivo.'], answer:1, explanation:'Macrocitose, reticulocitopenia e neutrófilos hipersegmentados indicam anemia megaloblástica, por deficiência de B12 ou folato. É importante dosar ambos e não tratar folato isoladamente sem excluir B12, pois a deficiência de B12 pode causar dano neurológico progressivo.', tags:['VCM alto','Hipersegmentação','Reticulocitopenia'] },
  { id:'sup5', theme:'Anemias', level:'Intermediário', title:'PA 1 • Crise vaso-oclusiva', stem:'Paciente jovem com doença falciforme apresenta dor intensa recorrente em membros inferiores, Hb 7,2 g/dL, leucocitose, plaquetose e reticulocitose. A melhor conduta é:', options:['Transfusão imediata e antibióticos para todos os casos.','Analgésicos apenas quando necessário, evitando opioides.','Hidratação e analgesia adequada para estabilização.','Evitar analgésicos para não mascarar complicações.','Hidratação, analgesia adequada e, assim que possível, iniciar hidroxiureia.'], answer:4, explanation:'A crise vaso-oclusiva requer avaliação de gravidade, hidratação criteriosa, analgesia adequada — inclusive opioides quando indicados — e pesquisa de complicações. Após a estabilização e avaliação especializada, a hidroxiureia reduz a frequência de crises recorrentes.', tags:['Crise vaso-oclusiva','Hidroxiureia','Analgesia'] },
  { id:'sup6', theme:'Anemias', level:'Intermediário', title:'PA 1 • Ferro na anemia por perda menstrual', stem:'Mulher de 28 anos, estável, com anemia microcítica e história de fluxo menstrual aumentado já tratado hormonalmente. Qual esquema é mais apropriado para tratar a anemia e reduzir recidiva?', options:['Transfundir dois concentrados de hemácias.','Transfusão associada a ferro intravenoso.','Apenas ferro endovenoso por cinco semanas.','Ferro oral em dose terapêutica por 4 a 6 meses.','Transfundir um concentrado de hemácias.'], answer:3, explanation:'Em paciente estável, a transfusão não é a primeira escolha. A reposição oral de ferro por tempo suficiente para corrigir a hemoglobina e repletar os estoques, junto ao controle da perda menstrual, é a estratégia habitual. Ferro intravenoso fica reservado para intolerância, má absorção ou necessidade específica.', tags:['Ferro oral','Microcitose','Menorragia'] },
  { id:'sup7', theme:'Anemias', level:'Avançado', title:'PA 1 • Microcitose com reticulocitose', stem:'Mulher de 46 anos apresenta anemia, icterícia e reticulócitos de 150.000/mm³. Hb 7,2 g/dL e VCM 65 fL. Qual a melhor conduta investigativa?', options:['Repor vitamina B12 e ácido fólico.','Solicitar teste da antiglobulina direta.','Realizar medula óssea para afastar anemia aplásica.','Realizar eletroforese de hemoglobina para excluir talassemia.','Investigar o trato digestivo com endoscopia e colonoscopia.'], answer:3, explanation:'A microcitose importante associada à reticulocitose e icterícia sugere hemólise ou hemoglobinopatia, e a talassemia deve ser investigada com eletroforese. A decisão de investigar trato digestivo depende de confirmação de deficiência de ferro e do contexto clínico.', tags:['Microcitose','Reticulocitose','Talassemia'] },
  { id:'sup8', theme:'Imuno-hematologia', level:'Intermediário', title:'PA 1 • Petéquias e hemostasia primária', stem:'Mulher de 38 anos apresenta equimoses, petéquias e gengivorragia. Não usa medicamentos e não tem hepatoesplenomegalia. Qual afirmação está correta?', options:['A investigação deve iniciar pela contagem de plaquetas, pois sugere alteração da hemostasia primária.','A investigação deve começar pela dosagem de fatores da via intrínseca.','A hipótese mais provável é distúrbio congênito de agregação plaquetária.','O diagnóstico mais provável é hemofilia A.','A investigação deve começar apenas por TAP e TTPa.'], answer:0, explanation:'Petéquias e sangramento mucoso sugerem defeito da hemostasia primária. A contagem de plaquetas é uma etapa inicial essencial; depois, conforme o resultado, avaliam-se função plaquetária, doença de von Willebrand e causas secundárias.', tags:['Petéquias','Hemostasia primária','Plaquetas'] },
  { id:'sup9', theme:'Anemias', level:'Básico', title:'PA 1 • RDW nas anemias', stem:'Sobre o RDW, índice que mede a distribuição do volume eritrocitário, assinale a alternativa correta.', options:['RDW não é útil nas anemias microcíticas.','RDW é habitualmente elevado nas talassemias.','Aumento isolado de RDW indica estoques de ferro normais.','Na deficiência nutricional de ferro o RDW não se altera.','RDW é habitualmente elevado nas anemias ferroprivas.'], answer:4, explanation:'Na anemia ferropriva, a produção de hemácias ocorre em fases diferentes, aumentando a anisocitose e o RDW. Em talassemia menor, o RDW pode ser normal ou apenas discretamente elevado, o que ajuda na diferenciação em conjunto com o número de hemácias e a eletroforese.', tags:['RDW','Anisocitose','Ferropriva'] },
  { id:'sup10', theme:'Coagulopatias', level:'Básico', title:'PA 1 • Hemostasia primária e secundária', stem:'Sobre os defeitos da hemostasia, podemos afirmar que:', options:['Na hemostasia primária, os sangramentos geralmente são superficiais, em pele, nariz e mucosas.','Na hemostasia primária, a história familiar é sempre ligada ao X.','Não existem diferenças clínicas entre hemostasia primária e secundária.','Na hemostasia secundária, o sangramento tende a ser imediato e superficial.','Na hemostasia secundária, petéquias são a manifestação típica.'], answer:0, explanation:'Defeitos da hemostasia primária causam sangramento mucocutâneo, como petéquias, epistaxe e gengivorragia. Defeitos da coagulação secundária tendem a causar sangramento profundo, hemartroses e hematomas, muitas vezes tardio após o trauma.', tags:['Hemostasia primária','Hemostasia secundária','Sangramento mucocutâneo'] },
  { id:'sup11', theme:'Onco-hematologia', level:'Intermediário', title:'Avaliação 2024 • Leucocitose reacional', stem:'Mulher de 38 anos apresenta pielonefrite grave, febre, hipotensão e leucócitos 23.000/mm³ com 14% de bastões. As alterações no sangue são causadas por:', options:['Anemia por insuficiência renal e falta de eritropoetina.','Leucocitose por infiltração de blastos na medula.','Anemia por deficiência de ferro causada pela hematúria.','Leucocitose com desvio à esquerda reacional ao quadro infeccioso.','Anemia provocada por hemólise crônica.'], answer:3, explanation:'A leucocitose neutrofílica com bastões, no contexto de infecção bacteriana grave, representa desvio à esquerda reacional. A prioridade clínica é tratar a sepse, colher culturas quando apropriado e iniciar antibiótico e suporte.', tags:['Desvio à esquerda','Neutrofilia','Infecção'] },
  { id:'sup12', theme:'Anemias', level:'Intermediário', title:'Avaliação 2024 • Padrões de VCM', stem:'Considere: I — doença renal crônica em hemodiálise; II — mulher vegana; III — mulher jovem com menorragia. As anemias microcítica, normocítica e macrocítica aparecem mais provavelmente em:', options:['I, III e II.','III, I e II.','I, II e III.','III, II e I.','II, III e I.'], answer:1, explanation:'A menorragia favorece deficiência de ferro e anemia microcítica (III); a doença renal crônica costuma causar anemia normocítica por deficiência relativa de eritropoetina (I); dieta vegana sem reposição adequada aumenta o risco de deficiência de B12 e macrocitose (II).', tags:['VCM','Doença renal','B12'] },
  { id:'sup13', theme:'Anemias', level:'Intermediário', title:'Avaliação 2024 • Hemólise extravascular', stem:'Para confirmar a suspeita de anemia hemolítica extravascular, qual sinal clínico e exame são mais compatíveis?', options:['Hemoglobinúria e sumário de urina.','Palidez e perfil do ferro.','Taquicardia e contagem de reticulócitos.','Icterícia e bilirrubina indireta.','Dispneia e dosagem de vitamina B12.'], answer:3, explanation:'Na hemólise extravascular, macrófagos esplênicos e hepáticos removem hemácias e produzem aumento de bilirrubina indireta, que pode se manifestar como icterícia. Hemoglobinúria é mais característica de hemólise intravascular.', tags:['Hemólise extravascular','Bilirrubina indireta','Icterícia'] },
  { id:'sup14', theme:'Anemias', level:'Intermediário', title:'Avaliação 2024 • Diagnóstico de anemia falciforme', stem:'Criança de 12 anos com anemia normocítica, icterícia, dores osteoarticulares recorrentes, dactilite e infecções repetidas apresenta qual diagnóstico?', options:['Leucemia aguda.','Anemia falciforme.','Anemia por sangramento menstrual.','Anemia ferropriva.','Falência da medula óssea.'], answer:1, explanation:'A combinação de hemólise crônica, crises vaso-oclusivas, dactilite e maior suscetibilidade a infecções é típica da doença falciforme. A confirmação é feita por eletroforese ou método equivalente de identificação de hemoglobinas.', tags:['Dactilite','Crise vaso-oclusiva','Hemólise crônica'] },
  { id:'sup15', theme:'Anemias', level:'Avançado', title:'Avaliação 2024 • Anemia após cirurgia bariátrica', stem:'Mulher de 40 anos, submetida a bypass gástrico há 8 anos, apresenta parestesias e anemia macrocítica grave. Qual mecanismo e conduta são mais prováveis?', options:['Má absorção de vitamina B12; administrar vitamina B12 intramuscular mensal.','Perda menstrual e deficiência de ferro; reposição intravenosa de ferro.','Gastrite alcalina; omeprazol e ácido fólico.','Baixa ingesta de ferro; dieta e ferro oral.','Hemólise crônica; suplementar ácido fólico.'], answer:0, explanation:'O bypass gástrico reduz a absorção de B12 e pode causar anemia megaloblástica e manifestações neurológicas anos depois. A reposição parenteral de B12 é apropriada quando há má absorção ou sintomas neurológicos.', tags:['Bariátrica','B12','Parestesias'] },
  { id:'sup16', theme:'Coagulopatias', level:'Intermediário', title:'Avaliação 2024 • Sangramento mucocutâneo com plaquetas normais', stem:'Jovem apresenta epistaxe recorrente, gengivorragia e equimoses. Hemoglobina, leucócitos e plaquetas são normais. Qual causa é mais provável?', options:['Anemia hemolítica hereditária.','Distúrbio da hemostasia secundária; solicitar TP.','Defeito de adesão ou agregação plaquetária.','Distúrbio da hemostasia secundária; solicitar TTPa.','Observar, pois plaquetas normais excluem doença.'], answer:2, explanation:'Sangramento mucocutâneo com contagem de plaquetas normal sugere defeito funcional plaquetário ou doença de von Willebrand, que afeta a adesão. A investigação pode incluir TP, TTPa, antígeno/atividade do vWF e testes de função plaquetária.', tags:['vWF','Adesão plaquetária','Epistaxe'] },
  { id:'sup17', theme:'Coagulopatias', level:'Intermediário', title:'Avaliação 2024 • Doença de von Willebrand', stem:'Jovem com epistaxe frequente, menorragia e história semelhante na mãe e irmã apresenta anemia microcítica, TP normal e TTPa discretamente prolongado. A hipótese mais provável é:', options:['Hemofilia A.','Telangiectasia hemorrágica hereditária.','Doença de von Willebrand.','Anticoagulante lúpico.','Deficiência de fator da via intrínseca sem outra especificação.'], answer:2, explanation:'Sangramento mucocutâneo, menorragia, padrão familiar em ambos os sexos e TP normal favorecem doença de von Willebrand. O TTPa pode estar discretamente prolongado quando o fator VIII é reduzido por menor estabilidade.', tags:['Von Willebrand','Menorragia','Herança autossômica'] },
  { id:'sup18', theme:'Coagulopatias', level:'Intermediário', title:'Avaliação 2024 • Hemofilias', stem:'Sobre as hemofilias, qual afirmação está correta?', options:['Na hemofilia A leve, a atividade do fator VIII varia entre 3–5%.','Na hemofilia grave, a hemartrose mais comum envolve pequenas articulações das mãos.','As principais manifestações hemorrágicas são musculares e articulares.','A deficiência hereditária do fator IX não causa distúrbio hemorrágico.','Hemofilia B é causada por deficiência do fator XI.'], answer:2, explanation:'Hemofilias A e B causam sangramentos profundos, especialmente hemartroses e hematomas musculares. Hemofilia A é deficiência de VIII e hemofilia B de IX; os níveis definem gravidade e não se limitam ao intervalo descrito na alternativa A.', tags:['Hemofilia A','Hemofilia B','Hemartrose'] }

  { id:'supess1', theme:'Imuno-hematologia', level:'Avançado', title:'Avaliação 2024 • Anemia hemolítica autoimune no LES', stem:'Mulher jovem com LES apresenta anemia grave, icterícia, Hb 5,9 g/dL, Ht 18%, VCM 94 fL e RDW 13%. Responda: quais exames confirmam o diagnóstico e qual o melhor tratamento inicial?', answer:'Solicitar provas de hemólise — contagem de reticulócitos, LDH, bilirrubina indireta e haptoglobina — e teste da antiglobulina direta (Coombs direto), esperado positivo na anemia hemolítica autoimune. A conduta inicial, após avaliação de gravidade e suporte transfusional quando necessário, é corticosteroide sistêmico; a investigação deve considerar atividade do LES e causas secundárias.', criteria:['Reconhecer hemólise','Solicitar Coombs direto','Citar provas de hemólise','Indicar corticosteroide','Comentar suporte transfusional conforme gravidade'] },
  { id:'supess2', theme:'Coagulopatias', level:'Avançado', title:'Avaliação 2024 • Criança com sangramento profundo', stem:'Menino de 1 ano apresenta trauma importante no joelho, hematoma subgaleal extenso e equimoses. Um primo materno tem sintomas semelhantes. Responda: quais exames você solicita para confirmar a hipótese e qual conduta é necessária?', answer:'A hipótese principal é hemofilia, pela criança do sexo masculino, sangramento profundo e padrão ligado à linhagem materna. Solicitar hemograma e plaquetas, TP, TTPa, teste de mistura e dosagem dos fatores VIII e IX; o padrão esperado é TTPa prolongado com TP normal e correção no teste de mistura, seguido de redução do fator correspondente. A conduta é estabilização, avaliação do sangramento e reposição imediata do fator em falta, evitando procedimentos intramusculares e usando concentrado específico.', criteria:['Suspeitar de hemofilia','Solicitar TP, TTPa e teste de mistura','Dosar fatores VIII e IX','Interpretar TP normal e TTPa prolongado','Indicar reposição do fator'] }

function getRanking(){ const user={name:state.name,correct:state.objectiveCorrect.length,answered:state.objectiveAnswered.length,avatar:(state.name||'Você').slice(0,2).toUpperCase(),points:state.points,isUser:true}; return [...mockRank.map(x=>({...x,points:x.correct*10+x.answered})),user].sort((a,b)=>b.correct-a.correct||pct(b.correct,b.answered)-pct(a.correct,a.answered)||b.answered-a.answered); }
function themeButtons(kind){ const current=state[kind==='objective'?'objectiveTheme':'essayTheme']; return `<div class="flex flex-wrap gap-2">${themes.map(t=>`<button onclick="setTheme('${kind}','${t}')" class="rounded-full border px-3 py-2 text-xs font-semibold transition ${current===t?'border-crimson bg-red-950/60 text-rose':'border-line bg-panel2 text-zinc-500 hover:border-zinc-600 hover:text-zinc-200'}">${t}</button>`).join('')}</div>`; }
function renderObjective(){ updateShell(); const list=filtered('objective'); if(!list.length){document.getElementById('view-objective').innerHTML='<div class="rounded-3xl border border-line bg-panel p-10 text-center"><p class="text-4xl">◌</p><h2 class="mt-4 text-2xl font-black">Nenhuma questão neste filtro</h2><button onclick="setTheme(\'objective\',\'Todos\')" class="mt-5 rounded-xl bg-crimson px-4 py-3 text-sm font-bold">Ver banco completo</button></div>';return;} const q=list[state.currentObjective%list.length]; const answered=state.objectiveAnswered.includes(q.id); const previous=state.objectiveAnswered.includes(q.id)?(state.objectiveCorrect.includes(q.id)?q.answer:null):null; document.getElementById('view-objective').innerHTML=`<section class="mb-6 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><div class="mb-3 flex items-center gap-2">${badge('Questões objetivas')} <span class="text-xs text-zinc-600">/ ${state.objectiveTheme}</span></div><h1 class="text-3xl font-black">Raciocínio <span class="text-rose">clínico</span></h1><p class="mt-2 text-sm text-zinc-400">Escolha uma alternativa. O feedback aparece imediatamente após sua resposta.</p></div><div class="text-left md:text-right"><p class="text-xs text-zinc-500">Questão ${state.currentObjective%list.length+1} de ${list.length}</p><div class="mt-2 h-2 w-40 overflow-hidden rounded-full bg-zinc-800 md:ml-auto"><div class="progress-fill h-full rounded-full bg-rose" style="width:${((state.currentObjective%list.length+1)/list.length)*100}%"></div></div></div></section><div class="mb-6 rounded-2xl border border-line bg-panel p-4"><div class="mb-3 flex items-center justify-between"><span class="text-xs font-bold uppercase tracking-[.16em] text-zinc-500">Filtrar por subtema</span><span class="text-xs text-zinc-600">${state.objectiveAnswered.length} respondidas no total</span></div>${themeButtons('objective')}</div><article class="rounded-3xl border border-line bg-panel p-5 shadow-glow sm:p-8"><div class="flex flex-wrap items-center gap-2">${badge(q.theme)} ${badge(q.level,'amber')} </div><h2 class="mt-5 text-xl font-bold leading-8 sm:text-2xl">${q.title}</h2><p class="mt-5 max-w-4xl text-[15px] leading-8 text-zinc-300">${q.stem}</p><div class="mt-7 grid gap-3">${q.options.map((op,i)=>`<button data-option="${i}" onclick="answerObjective('${q.id}',${i})" class="option-card ${answered?'disabled':''} flex w-full items-start gap-4 rounded-2xl border border-line bg-panel2 p-4 text-left ${answered&&i===q.answer?'correct':''} ${answered&&i!==q.answer&&state.objectiveAnswered.includes(q.id)&&state.objectiveCorrect.includes(q.id)===false&&i===getAttempt(q.id)?'wrong':''}"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-line bg-zinc-900 text-xs font-black text-zinc-400">${String.fromCharCode(65+i)}</span><span class="pt-1 text-sm leading-6 text-zinc-300">${op}</span>${answered&&i===q.answer?'<span class="ml-auto text-emerald-400">✓</span>':''}</button>`).join('')}</div>${answered?`<div class="mt-7 rounded-2xl border border-emerald-900/60 bg-emerald-950/20 p-5"><div class="flex items-center gap-2 text-sm font-bold text-emerald-300"><span class="grid h-6 w-6 place-items-center rounded-full bg-emerald-900">${state.objectiveCorrect.includes(q.id)?'✓':'!'}</span>${state.objectiveCorrect.includes(q.id)?'Resposta correta':'Resposta registrada'}</div><p class="mt-3 text-sm leading-7 text-zinc-300"><strong class="text-zinc-100">Comentário do professor:</strong> ${q.explanation}</p><div class="mt-4 flex flex-wrap gap-2">${q.tags.map(t=>`<span class="rounded-full bg-zinc-900 px-2.5 py-1 text-[11px] text-zinc-500">${t}</span>`).join('')}</div></div>`:''}<div class="mt-8 flex flex-wrap justify-between gap-3"><button onclick="showView('dashboard')" class="rounded-xl border border-line px-4 py-3 text-sm font-semibold text-zinc-400 transition hover:text-white">← Dashboard</button>${answered?`<button onclick="nextObjective()" class="rounded-xl bg-crimson px-5 py-3 text-sm font-bold text-white transition hover:bg-rose">Próxima questão <span class="ml-2">→</span></button>`:'<p class="self-center text-xs text-zinc-600">Selecione uma alternativa para receber o feedback.</p>'}</div></article>`; }
function getAttempt(id){ try{return JSON.parse(localStorage.getItem('hemolab-attempts')||'{}')[id];}catch(e){return null;} }
function answerObjective(id,index){ const q=objectiveQuestions.find(x=>x.id===id); if(!q||state.objectiveAnswered.includes(id))return; state.objectiveAnswered.push(id); localStorage.setItem('hemolab-attempts',JSON.stringify({...JSON.parse(localStorage.getItem('hemolab-attempts')||'{}'),[id]:index})); if(index===q.answer){state.objectiveCorrect.push(id);state.points+=10;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);toast('Acerto! Seu raciocínio está no caminho certo.','success');}else{state.streak=0;toast('Resposta registrada. Revise o comentário do professor.','info');} saveState(); renderObjective(); }
function nextObjective(){ const list=filtered('objective'); state.currentObjective=(state.currentObjective+1)%list.length; saveState(); renderObjective(); }
function renderEssay(){ updateShell(); const list=filtered('essay'); const q=list[state.currentEssay%list.length]; const saved=state.essays[q.id]||{}; const sent=state.essaySent.includes(q.id); document.getElementById('view-essay').innerHTML=`<section class="mb-6 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><div class="mb-3 flex items-center gap-2">${badge('Estudo de caso')} <span class="text-xs text-zinc-600">/ ${state.essayTheme}</span></div><h1 class="text-3xl font-black">Prática <span class="text-rose">discursiva</span></h1><p class="mt-2 text-sm text-zinc-400">Estruture sua hipótese, justifique os achados e compare com o padrão esperado.</p></div><div class="text-left md:text-right"><p class="text-xs text-zinc-500">Caso ${state.currentEssay%list.length+1} de ${list.length}</p><p class="mt-2 text-xs text-zinc-600">${state.essaySent.length} enviados</p></div></section><div class="mb-6 rounded-2xl border border-line bg-panel p-4"><div class="mb-3 flex items-center justify-between"><span class="text-xs font-bold uppercase tracking-[.16em] text-zinc-500">Filtrar por subtema</span><span class="text-xs text-zinc-600">Compare sem medo: é prática.</span></div>${themeButtons('essay')}</div><article class="rounded-3xl border border-line bg-panel p-5 shadow-glow sm:p-8"><div class="flex flex-wrap items-center gap-2">${badge(q.theme)} ${badge(q.level,'amber')}</div><h2 class="mt-5 text-xl font-bold leading-8 sm:text-2xl">${q.title}</h2><div class="mt-5 rounded-2xl border border-red-950/70 bg-red-950/20 p-5"><p class="text-[10px] font-bold uppercase tracking-[.18em] text-rose">Caso clínico</p><p class="mt-3 text-[15px] leading-8 text-zinc-300">${q.stem}</p></div><label class="mt-7 block text-sm font-bold text-zinc-200" for="essay-text">Sua resposta</label><textarea id="essay-text" maxlength="2000" oninput="document.getElementById('essay-count').textContent=this.value.length+'/2000'" class="mt-3 min-h-[230px] w-full resize-y rounded-2xl border border-line bg-zinc-950 p-4 text-sm leading-7 text-zinc-200 outline-none transition placeholder:text-zinc-700 focus:border-crimson" placeholder="Digite sua hipótese diagnóstica, o raciocínio clínico e a conduta...">${esc(saved.text||'')}</textarea><div class="mt-2 flex justify-between text-xs text-zinc-600"><span>Use linguagem clínica objetiva e cite os dados relevantes.</span><span id="essay-count">${(saved.text||'').length}/2000</span></div><div class="mt-5 flex flex-wrap gap-3"><button onclick="sendEssay('${q.id}')" class="rounded-xl bg-crimson px-5 py-3 text-sm font-bold text-white transition hover:bg-rose">${sent?'Atualizar resposta':'Enviar resposta'}</button>${sent?`<button onclick="toggleAnswer('${q.id}')" class="rounded-xl border border-line px-5 py-3 text-sm font-bold text-zinc-300 transition hover:border-rose/50 hover:text-white">${saved.show?'Ocultar gabarito':'Ver gabarito comentado'}</button>`:''}</div>${sent&&saved.show?`<div class="mt-7 space-y-5"><div class="rounded-2xl border border-emerald-900/60 bg-emerald-950/20 p-5"><p class="text-xs font-bold uppercase tracking-[.16em] text-emerald-300">Padrão de resposta esperado</p><p class="mt-3 text-sm leading-7 text-zinc-300">${q.answer}</p></div><div class="rounded-2xl border border-line bg-panel2 p-5"><p class="text-xs font-bold uppercase tracking-[.16em] text-zinc-500">Critérios de correção</p><div class="mt-3 grid gap-2 sm:grid-cols-2">${q.criteria.map((c,i)=>`<div class="flex gap-2 text-sm text-zinc-400"><span class="text-rose">${i+1}.</span>${c}</div>`).join('')}</div><div class="mt-5 border-t border-line pt-4"><label class="text-xs font-bold uppercase tracking-[.16em] text-zinc-500">Autoavaliação</label><div class="mt-3 flex gap-2">${[1,2,3,4,5].map(n=>`<button onclick="rateEssay('${q.id}',${n})" class="grid h-9 w-9 place-items-center rounded-lg border ${saved.rating===n?'border-rose bg-red-950/60 text-rose':'border-line bg-zinc-950 text-zinc-500'} text-sm transition hover:border-rose">${n}</button>`).join('')}</div><p class="mt-2 text-xs text-zinc-600">De 1 (preciso revisar) a 5 (domino o tema).</p></div></div></div>`:''}<div class="mt-8 flex justify-between gap-3"><button onclick="showView('dashboard')" class="rounded-xl border border-line px-4 py-3 text-sm font-semibold text-zinc-400 transition hover:text-white">← Dashboard</button><button onclick="nextEssay()" class="rounded-xl border border-line px-4 py-3 text-sm font-bold text-zinc-300 transition hover:border-rose/50 hover:text-white">Próximo caso →</button></div></article>`; }
function sendEssay(id){ const text=document.getElementById('essay-text').value.trim(); if(text.length<20){toast('Escreva pelo menos 20 caracteres antes de enviar.','error');return;} const old=state.essays[id]||{}; state.essays[id]={...old,text,show:true}; if(!state.essaySent.includes(id)) state.essaySent.push(id); saveState(); toast('Resposta salva. Compare com o gabarito comentado.','success'); renderEssay(); }
function toggleAnswer(id){ state.essays[id].show=!state.essays[id].show; saveState(); renderEssay(); }
function rateEssay(id,n){ state.essays[id].rating=n; saveState(); renderEssay(); toast('Autoavaliação salva.','success'); }
function nextEssay(){ const list=filtered('essay'); state.currentEssay=(state.currentEssay+1)%list.length; saveState(); renderEssay(); }
function setTheme(kind,theme){ if(kind==='objective'){state.objectiveTheme=theme;state.currentObjective=0;showView('objective');}else{state.essayTheme=theme;state.currentEssay=0;showView('essay');} saveState(); }
function startTheme(theme){state.objectiveTheme=theme;state.currentObjective=0;saveState();showView('objective');}
function toast(msg,type='info'){ const root=document.getElementById('toast-root'); const color=type==='success'?'border-emerald-800 bg-emerald-950 text-emerald-200':type==='error'?'border-red-800 bg-red-950 text-red-200':'border-line bg-panel2 text-zinc-200'; const el=document.createElement('div');el.className=`toast max-w-xs rounded-xl border ${color} px-4 py-3 text-sm shadow-2xl`;el.textContent=msg;root.appendChild(el);setTimeout(()=>el.remove(),3200); }
function openNameModal(){ document.getElementById('modal-root').innerHTML=`<div class="fixed inset-0 z-50 grid place-items-center bg-black/75 p-4"><div class="w-full max-w-md rounded-3xl border border-line bg-panel p-6 shadow-2xl"><div class="flex items-start justify-between"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-rose">Perfil local</p><h2 class="mt-2 text-2xl font-black">Como devemos chamar você?</h2></div><button onclick="closeModal()" class="text-xl text-zinc-600 hover:text-white">×</button></div><p class="mt-3 text-sm leading-6 text-zinc-400">Seu nome aparece apenas no ranking deste navegador. Nenhum dado é enviado.</p><input id="name-input" value="${esc(state.name)}" maxlength="24" class="mt-5 w-full rounded-xl border border-line bg-zinc-950 px-4 py-3 text-sm text-white outline-none focus:border-crimson" placeholder="Ex.: Dra. Camila" /><div class="mt-5 flex justify-end gap-3"><button onclick="closeModal()" class="rounded-xl border border-line px-4 py-3 text-sm text-zinc-400">Cancelar</button><button onclick="saveName()" class="rounded-xl bg-crimson px-4 py-3 text-sm font-bold">Salvar perfil</button></div></div></div>`;setTimeout(()=>document.getElementById('name-input')?.focus(),50); }
function saveName(){const n=document.getElementById('name-input').value.trim()||'Você';state.name=n.slice(0,24);saveState();closeModal();updateShell();renderDashboard();toast('Perfil atualizado.','success');}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function resetProgress(){ if(confirm('Tem certeza que deseja apagar o progresso salvo neste navegador?')){localStorage.removeItem(storageKey);localStorage.removeItem('hemolab-attempts');state={name:state.name,objectiveAnswered:[],objectiveCorrect:[],essaySent:[],currentObjective:0,currentEssay:0,objectiveTheme:'Todos',essayTheme:'Todos',points:0,streak:0,bestStreak:0,essays:{}};showView('dashboard');toast('Progresso reiniciado.','info');} }
loadState(); showView('dashboard');
</script>
</body>
</html>
